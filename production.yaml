# ============================================================================
# Keycloak — PRODUCTION environment (on-prem production cluster)
# ============================================================================
# No PostgreSQL here: production uses the client's external HA PostgreSQL
# cluster via its stable read-write endpoint. Deliberately parallel to
# staging.yaml — diff the two files to see exactly what differs
# (instances 3 vs 2, resources, hostname, DB source + CA, PDB, and the CNPG
# block that only staging has; nothing else).
#
# Prerequisites (exact commands in operators/install-notes.md):
#   1. Keycloak operator installed in the `keycloak` namespace
#   2. Secret `registry-creds` (GitLab deploy token, read_registry)
#   3. Secret `keycloak-db` (keys: username, password) — credentials of the
#      `keycloak` database owner on the client's PG
#   4. Secret `keycloak-db-ca` (key: ca.crt, PEM) — the client PG's server CA
#   5. Secret `keycloak-bootstrap-admin` (keys: username, password)
#   6. Every box in docs/production-readiness.md checked
#
# REPLACE BEFORE APPLYING:
#   <CLIENT-DOMAIN>          — the client's production auth domain suffix
#   <REGISTRY>               — the internal container registry (air-gapped
#                              cluster: images are mirrored there first)
#   <CLIENT-PG-RW-ENDPOINT>  — the client PG cluster's read-write endpoint
#                              (VIP / Patroni proxy / PgBouncer front — open
#                              item #1 in the design spec)
#   <ADMIN-HAPROXY-HOST>:<ADMIN-HAPROXY-PORT>
#                            — the internal HAProxy frontend for the admin
#                              console (reachable from RCRC jump servers only)
#   NodePorts 31080 (public) / 31180 (admin) — change if taken on the cluster
#
# Apply:    kubectl apply -f production.yaml
# Verify:   kubectl -n keycloak wait --for=condition=Ready keycloak/keycloak --timeout=15m
# ============================================================================
apiVersion: v1
kind: Namespace
metadata:
  name: keycloak
---
# ----------------------------------------------------------------------------
# Keycloak — 3 instances, operator-managed, client-approved sizing
# (1500m/2Gi requests, 3000m/3Gi limits per pod; peak fits on N-1 pods).
# Since Keycloak 26.0 the operator applies default anti-affinity so pods of
# this CR avoid sharing a node — the cluster needs >= 3 schedulable nodes.
# ----------------------------------------------------------------------------
apiVersion: k8s.keycloak.org/v2alpha1
kind: Keycloak
metadata:
  name: keycloak
  namespace: keycloak
spec:
  instances: 3
  # DESIGN DECISION: the official STOCK image, mirrored into the internal
  # registry, with startOptimized: false — the operator's standard mode, no
  # custom image anywhere. Keycloak runs `kc.sh build` as part of every pod
  # start (~40 s at the 3-CPU design limit), so the startup probe is sized for
  # it: 5 s x 120 = 10 min ceiling, normal start ~1-2 min. Accepted trade-off:
  # a restarted pod rejoins in ~1-2 min instead of ~30 s; peak still fits on
  # the remaining N-1 pods. Must match the operator version exactly.
  image: <REGISTRY>/keycloak/keycloak:26.5.2
  startOptimized: false
  startupProbe:
    periodSeconds: 5
    failureThreshold: 120
  imagePullSecrets:
    - name: registry-creds # GitLab registry: auth is mandatory
  db:
    vendor: postgres
    host: <CLIENT-PG-RW-ENDPOINT>
    database: keycloak
    usernameSecret:
      name: keycloak-db # created manually, see install-notes.md
      key: username
    passwordSecret:
      name: keycloak-db
      key: password
    # Fixed-size pool, 20 per pod x 3 pods = 60, inside the 70-connection
    # budget (60 app + 10 ops) agreed with the client.
    poolMinSize: 20
    poolInitialSize: 20
    poolMaxSize: 20
  http:
    httpEnabled: true # TLS terminates at the nginx LB in front of Kong
  hostname:
    hostname: https://auth.<CLIENT-DOMAIN>
    # Admin console + Admin API are served ONLY on this URL (Keycloak refuses
    # /admin on the public hostname above — even if a gateway ever routed it).
    # It is the internal HAProxy admin frontend, reachable from the RCRC jump
    # servers only; it must never appear in public DNS or in Kong.
    admin: http://<ADMIN-HAPROXY-HOST>:<ADMIN-HAPROXY-PORT>
  proxy:
    headers: xforwarded
  bootstrapAdmin:
    user:
      secret: keycloak-bootstrap-admin # created manually, see install-notes.md
  # TLS to the external PostgreSQL, verified against its CA. The secret
  # `keycloak-db-ca` (key ca.crt, PEM) is created by hand from the CA the DBA
  # team provides — see install-notes.md. If their PostgreSQL does not serve
  # TLS, removing db-tls-mode + this truststore is a documented risk decision,
  # not a default.
  truststores:
    db-ca:
      secret:
        name: keycloak-db-ca
  additionalOptions:
    - name: db-tls-mode
      value: verify-server
    - name: metrics-enabled
      value: "true"
    - name: event-metrics-user-enabled # login/logout event metrics for alerting
      value: "true"
    - name: log-console-output # structured logs for the log stack
      value: json
  resources:
    requests:
      cpu: 1500m
      memory: 2Gi
    limits:
      cpu: "3"
      memory: 3Gi
---
# ----------------------------------------------------------------------------
# Exposure — the cluster convention is NodePort behind HAProxy. Two separate
# services so the two paths can never be confused:
#
#   PUBLIC  internet → nginx (TLS) → Kong → HAProxy → keycloak-np (31080)
#           Kong routes ONLY the public OIDC paths of the client realm
#           (token, introspect, userinfo, logout, certs, .well-known) and
#           returns 403 for /admin and /realms/master.
#   ADMIN   RCRC jump servers → HAProxy (internal frontend) → keycloak-admin-np (31180)
#           Never in Kong, never in public DNS. hostname.admin above makes
#           Keycloak serve the console on this path only.
#
# The operator's own keycloak-service (ClusterIP) stays untouched.
# ----------------------------------------------------------------------------
apiVersion: v1
kind: Service
metadata:
  name: keycloak-np
  namespace: keycloak
  annotations:
    description: "PUBLIC OIDC endpoints — HAProxy backend for the Kong route"
spec:
  type: NodePort
  selector:
    app: keycloak
    app.kubernetes.io/managed-by: keycloak-operator
    app.kubernetes.io/component: server
  ports:
    - name: http
      port: 8080
      targetPort: 8080
      nodePort: 31080
---
apiVersion: v1
kind: Service
metadata:
  name: keycloak-admin-np
  namespace: keycloak
  annotations:
    description: "ADMIN CONSOLE — internal only. HAProxy admin frontend (RCRC jump servers). NEVER map into Kong."
spec:
  type: NodePort
  selector:
    app: keycloak
    app.kubernetes.io/managed-by: keycloak-operator
    app.kubernetes.io/component: server
  ports:
    - name: http
      port: 8080
      targetPort: 8080
      nodePort: 31180
---
# ----------------------------------------------------------------------------
# Survive voluntary disruptions (node drains, upgrades): always keep 2 of 3.
# Label selector matches the pods the operator creates for the CR above.
# ----------------------------------------------------------------------------
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: keycloak
  namespace: keycloak
spec:
  minAvailable: 2
  selector:
    matchLabels:
      app: keycloak
      app.kubernetes.io/managed-by: keycloak-operator
      app.kubernetes.io/component: server
