# ============================================================================
# Keycloak — STAGING environment (on-prem staging cluster)
# ============================================================================
# Everything staging needs in one file: namespace, in-cluster PostgreSQL
# (CloudNativePG, standing in for the client's external PG), Keycloak 26 via
# the official operator, and a PodDisruptionBudget.
#
# Prerequisites (exact commands in operators/install-notes.md):
#   1. CNPG operator installed on this cluster
#   2. Keycloak operator installed in the `keycloak` namespace
#   3. Secret `keycloak-bootstrap-admin` created (keys: username, password)
#
# REPLACE BEFORE APPLYING:
#   <CLIENT-DOMAIN>  — the client's staging auth domain suffix
#   <REGISTRY>       — the internal container registry (air-gapped cluster:
#                      all images are mirrored there first, see install-notes)
#
# Apply:    kubectl apply -f staging.yaml
# Verify:   kubectl -n keycloak wait --for=condition=Ready keycloak/keycloak --timeout=15m
# ============================================================================
apiVersion: v1
kind: Namespace
metadata:
  name: keycloak
---
# ----------------------------------------------------------------------------
# Staging PostgreSQL — CloudNativePG.
# Provides the same contract as the client's production cluster:
#   - stable read-write endpoint:  keycloak-pg-rw.keycloak.svc
#   - automatic failover once a replica exists (instances: 2 — needs a
#     second pre-provisioned PV; currently 1, see install-notes 0c)
# CNPG auto-generates Secret `keycloak-pg-app` (keys username/password) for the
# `keycloak` database owner — the Keycloak CR below consumes it directly.
# ----------------------------------------------------------------------------
apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: keycloak-pg
  namespace: keycloak
spec:
  # Staging runs a single instance for now (one static PV available). Raise
  # to 2 once a second PV exists — CNPG clones the primary online, no rebuild.
  instances: 1
  imageName: <REGISTRY>/cloudnative-pg/postgresql:16 # mirrored from ghcr.io
  imagePullSecrets:
    - name: registry-creds # GitLab registry: auth is mandatory
  # Without requests the PG pod is BestEffort — first to be evicted under node
  # pressure. Modest staging values; it is a light OLTP workload.
  resources:
    requests:
      cpu: 500m
      memory: 1Gi
    limits:
      cpu: "1"
      memory: 2Gi
  # Staging-only convenience: superuser access is needed when the migration
  # rehearsal restores the vendor dump into a scratch database. Never in prod
  # (prod PG is the client's anyway).
  enableSuperuserAccess: true
  # Data directory ownership — must match the owner of the backing volume.
  # 26:26 is the postgres user in the CNPG image; change only if the storage
  # enforces a different owner (see install-notes 0c).
  postgresUID: 26
  postgresGID: 26
  # Static, pre-provisioned PV (no dynamic provisioner on the staging
  # cluster). CNPG still creates the PVC itself (keycloak-pg-1); this template
  # pins it to our PV by name. Single-instance only — a 2nd instance would
  # need a 2nd PV and cannot share this volumeName.
  # KNOWN LIMITATION (accepted for staging): the only storage on the staging
  # cluster is the S3 CSI (ru.yandex.s3.csi/geesefs), so this PV is an S3
  # bucket via FUSE. PostgreSQL runs on it, but slowly (schema creation ~13 min
  # vs <1 on disk) and without real fsync semantics (a hard crash may need the
  # wipe-and-recreate from install-notes). Staging therefore validates
  # BEHAVIOUR (clustering, TLS, probes, realm import, logins) — NOT load-test
  # numbers or migration timings; those are measured against a real
  # PostgreSQL. Production is unaffected: its PG is external (VMs + NFS).
  storage:
    size: 50Gi
    pvcTemplate:
      storageClassName: ""
      volumeName: keycloak-pg1-pv
      resources:
        requests:
          storage: 50Gi
  bootstrap:
    initdb:
      database: keycloak
      owner: keycloak
---
# ----------------------------------------------------------------------------
# Keycloak — operator-managed.
# Same shape as production (clustering, spreading, rolling upgrades all get
# rehearsed); only instance count, resources, hostname, and the DB source
# differ. Since Keycloak 26.0 the operator applies default anti-affinity so
# pods of this CR avoid sharing a node.
# ----------------------------------------------------------------------------
apiVersion: k8s.keycloak.org/v2alpha1
kind: Keycloak
metadata:
  name: keycloak
  namespace: keycloak
spec:
  # Staging runs 2 (production: 3). Enough to prove clustering, spreading and
  # rolling restarts; the 3-node spread / N-1 capacity claim is a prod check.
  instances: 2
  # CURRENT (interim): the mirrored STOCK image with startOptimized: false.
  # Keycloak re-runs `kc.sh build` on every pod start (~40-100 s), which only
  # works because the CPU limit and startup probe below are raised to cover
  # it. TARGET: the pre-optimized image (build/keycloak-optimized/Dockerfile)
  # with startOptimized: true — pods start in seconds, and the interim
  # cpu/probe values can return to design values. Switch as soon as a
  # machine inside the gap with docker + registry push is available.
  image: <REGISTRY>/keycloak/keycloak:26.5.2
  startOptimized: false
  # image: <REGISTRY>/keycloak/keycloak:26.5.2-optimized
  # startOptimized: true
  # Interim: give the in-pod build time to finish (5 s x 240 = 20 min cap).
  # Remove once the optimized image is in use (operator default is fine then).
  startupProbe:
    periodSeconds: 5
    failureThreshold: 240
  imagePullSecrets:
    - name: registry-creds # GitLab registry: auth is mandatory
  db:
    vendor: postgres
    host: keycloak-pg-rw.keycloak.svc
    database: keycloak
    usernameSecret:
      name: keycloak-pg-app # generated by CNPG
      key: username
    passwordSecret:
      name: keycloak-pg-app
      key: password
    # Fixed-size pool, 20 per pod (production: x3 = 60, inside the 70-connection
    # budget of 60 app + 10 ops agreed with the client).
    poolMinSize: 20
    poolInitialSize: 20
    poolMaxSize: 20
  http:
    httpEnabled: true # TLS terminates at the nginx LB in front of Kong
  hostname:
    hostname: https://auth-staging.<CLIENT-DOMAIN>
  proxy:
    headers: xforwarded
  bootstrapAdmin:
    user:
      secret: keycloak-bootstrap-admin # created manually, see install-notes.md
  # TLS to PostgreSQL, verified against the CNPG-generated CA — rehearses the
  # production db-tls setup. CNPG creates the `keycloak-pg-ca` secret (ca.crt)
  # automatically alongside the cluster.
  truststores:
    db-ca:
      secret:
        name: keycloak-pg-ca
  additionalOptions:
    - name: db-tls-mode
      value: verify-server
    - name: metrics-enabled
      value: "true"
    - name: event-metrics-user-enabled # login/logout event metrics for alerting
      value: "true"
    - name: log-console-output # structured logs for the log stack
      value: json
  resources:
    requests:
      cpu: 500m
      memory: 1200Mi
    limits:
      cpu: "2" # interim: "1" starves the in-pod build; back to "1" with the optimized image
      memory: 1500Mi
---
# ----------------------------------------------------------------------------
# Survive voluntary disruptions (node drains, upgrades): with 2 instances,
# always keep 1 (production: 3 instances, minAvailable 2).
# Label selector matches the pods the operator creates for the CR above.
# ----------------------------------------------------------------------------
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: keycloak
  namespace: keycloak
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app: keycloak
      app.kubernetes.io/managed-by: keycloak-operator
      app.kubernetes.io/component: server
